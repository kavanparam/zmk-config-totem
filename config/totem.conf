# Enable zmk studio for realtime keymap updates: Unused & disabled
# CONFIG_ZMK_STUDIO=y
# CONFIG_ZMK_STUDIO_LOCKING=n

# Enable mouse
CONFIG_ZMK_POINTING=y
# CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# Enable deep sleep & improve battery life
CONFIG_ZMK_SLEEP=y
# 1 min for testing
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=60000
